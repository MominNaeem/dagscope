name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Lineage check (parse success rate + cycle detection)
        run: |
          dagscope check --dag-dir sample_dags
          # Cycle detection exits 1 — expected for sample DAGs (seeded cycle)
          dagscope check --cycles --dag-dir sample_dags || true

      - name: Smoke test impact queries
        run: |
          dagscope impact --table public.positions_daily --no-llm --dag-dir sample_dags
          dagscope impact --table raw.instrument_master  --no-llm --dag-dir sample_dags
