<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300">
  <rect width="1080" height="300" fill="#070d1a" rx="12"/>

  <defs>
    <marker id="a"  markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#2a3d5a"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#f5a623"/></marker>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#ff4060"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#22d3a0"/></marker>
  </defs>

  <!-- raw → positions_daily (orange = blast radius path) -->
  <line x1="193" y1="74"  x2="234" y2="104" stroke="#f5a623" stroke-width="2" marker-end="url(#ao)"/>
  <line x1="193" y1="155" x2="234" y2="120" stroke="#f5a623" stroke-width="2" marker-end="url(#ao)"/>

  <!-- raw.fx_rates → positions_usd -->
  <line x1="193" y1="238" x2="466" y2="84"  stroke="#2a3d5a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a)"/>

  <!-- raw.instrument_master → exposure_report (long, dashed) -->
  <line x1="193" y1="148" x2="848" y2="94"  stroke="#2a3d5a" stroke-width="1"   stroke-dasharray="4,4" marker-end="url(#a)"/>

  <!-- positions_daily → positions_usd (orange) -->
  <line x1="428" y1="107" x2="466" y2="82"  stroke="#f5a623" stroke-width="2" marker-end="url(#ao)"/>

  <!-- CYCLE: positions_daily ↔ settlement_breaks (red curved) -->
  <path d="M 340,138 C 290,175 290,200 340,212" fill="none" stroke="#ff4060" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 358,212 C 410,200 410,155 358,138" fill="none" stroke="#ff4060" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#ar)"/>
  <text x="268" y="182" font-size="11" fill="#ff6080" font-family="monospace">⟳ cycle</text>

  <!-- positions_usd → pnl_daily (green) -->
  <line x1="640" y1="82"  x2="680" y2="142" stroke="#22d3a0" stroke-width="2" marker-end="url(#ag)"/>

  <!-- pnl_daily → exposure_report -->
  <line x1="740" y1="152" x2="848" y2="98"  stroke="#22d3a0" stroke-width="2" marker-end="url(#ag)"/>
  <!-- pnl_daily → risk_dashboard_ext -->
  <line x1="740" y1="168" x2="848" y2="244" stroke="#22d3a0" stroke-width="2" marker-end="url(#ag)"/>
  <!-- exposure_report → risk_dashboard_ext -->
  <line x1="930" y1="107" x2="930" y2="228" stroke="#2a3d5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- hop distance label -->
  <text x="50" y="290" font-size="10" fill="#4a5a7a" font-family="monospace">raw.trades → … → risk_dashboard_ext  =  6 hops</text>

  <!-- RAW LAYER NODES -->
  <!-- raw.trades -->
  <ellipse cx="110" cy="74"  rx="83" ry="22" fill="#2d1f00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="110" y="71"  text-anchor="middle" font-size="10" fill="#f5a623" font-family="monospace" font-weight="bold">raw</text>
  <text x="110" y="83"  text-anchor="middle" font-size="10" fill="#e8edf7" font-family="monospace">.trades</text>

  <!-- raw.instrument_master -->
  <ellipse cx="110" cy="155" rx="83" ry="22" fill="#2d1f00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="110" y="152" text-anchor="middle" font-size="10" fill="#f5a623" font-family="monospace" font-weight="bold">raw</text>
  <text x="110" y="164" text-anchor="middle" font-size="9"  fill="#e8edf7" font-family="monospace">.instrument_master</text>

  <!-- raw.fx_rates -->
  <ellipse cx="110" cy="238" rx="83" ry="22" fill="#2d1f00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="110" y="235" text-anchor="middle" font-size="10" fill="#f5a623" font-family="monospace" font-weight="bold">raw</text>
  <text x="110" y="247" text-anchor="middle" font-size="10" fill="#e8edf7" font-family="monospace">.fx_rates</text>

  <!-- public.positions_daily  (HIGHLIGHTED — cycle node) -->
  <ellipse cx="335" cy="115" rx="95" ry="26" fill="#3d0a24" stroke="#ff4060" stroke-width="2.5"/>
  <text x="335" y="112" text-anchor="middle" font-size="10" fill="#ff8080" font-family="monospace" font-weight="bold">public</text>
  <text x="335" y="126" text-anchor="middle" font-size="10" fill="#ffb0b0" font-family="monospace">.positions_daily</text>

  <!-- public.settlement_breaks (cycle, dashed border) -->
  <ellipse cx="335" cy="225" rx="95" ry="22" fill="#2d0a0a" stroke="#ff6080" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="335" y="222" text-anchor="middle" font-size="10" fill="#ff8080" font-family="monospace" font-weight="bold">public</text>
  <text x="335" y="234" text-anchor="middle" font-size="9"  fill="#ffb0b0" font-family="monospace">.settlement_breaks</text>

  <!-- public.positions_usd -->
  <ellipse cx="555" cy="74"  rx="85" ry="22" fill="#003d2e" stroke="#22d3a0" stroke-width="1.5"/>
  <text x="555" y="71"  text-anchor="middle" font-size="10" fill="#22d3a0" font-family="monospace" font-weight="bold">public</text>
  <text x="555" y="83"  text-anchor="middle" font-size="10" fill="#e8edf7" font-family="monospace">.positions_usd</text>

  <!-- public.pnl_daily -->
  <ellipse cx="730" cy="160" rx="75" ry="22" fill="#003d2e" stroke="#22d3a0" stroke-width="1.5"/>
  <text x="730" y="157" text-anchor="middle" font-size="10" fill="#22d3a0" font-family="monospace" font-weight="bold">public</text>
  <text x="730" y="169" text-anchor="middle" font-size="10" fill="#e8edf7" font-family="monospace">.pnl_daily</text>

  <!-- public.exposure_report -->
  <ellipse cx="935" cy="88"  rx="88" ry="22" fill="#003d2e" stroke="#22d3a0" stroke-width="1.5"/>
  <text x="935" y="85"  text-anchor="middle" font-size="10" fill="#22d3a0" font-family="monospace" font-weight="bold">public</text>
  <text x="935" y="97"  text-anchor="middle" font-size="10" fill="#e8edf7" font-family="monospace">.exposure_report</text>

  <!-- public.risk_dashboard_ext -->
  <ellipse cx="935" cy="250" rx="88" ry="22" fill="#003d2e" stroke="#22d3a0" stroke-width="1.5"/>
  <text x="935" y="247" text-anchor="middle" font-size="10" fill="#22d3a0" font-family="monospace" font-weight="bold">public</text>
  <text x="935" y="259" text-anchor="middle" font-size="9"  fill="#e8edf7" font-family="monospace">.risk_dashboard_ext</text>

  <!-- Legend -->
  <rect x="20" y="14" width="10" height="10" rx="2" fill="#2d1f00" stroke="#f5a623"/>
  <text x="34" y="23" font-size="10" fill="#9aa5b8" font-family="sans-serif">raw schema</text>
  <ellipse cx="112" cy="19" rx="8" ry="6" fill="#003d2e" stroke="#22d3a0"/>
  <text x="124" y="23" font-size="10" fill="#9aa5b8" font-family="sans-serif">public schema</text>
  <ellipse cx="215" cy="19" rx="8" ry="6" fill="#3d0a24" stroke="#ff4060" stroke-width="1.5"/>
  <text x="227" y="23" font-size="10" fill="#9aa5b8" font-family="sans-serif">cycle node</text>
  <line x1="296" y1="19" x2="316" y2="19" stroke="#f5a623" stroke-width="2" marker-end="url(#ao)"/>
  <text x="320" y="23" font-size="10" fill="#9aa5b8" font-family="sans-serif">blast radius path</text>
</svg>
