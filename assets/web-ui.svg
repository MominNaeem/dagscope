<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <!-- browser chrome -->
  <rect width="960" height="480" fill="#0d1117" rx="10"/>
  <rect x="0" y="0" width="960" height="36" fill="#161b22" rx="10"/>
  <rect x="0" y="26" width="960" height="10" fill="#161b22"/>
  <!-- traffic lights -->
  <circle cx="18" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="18" r="5" fill="#febc2e"/>
  <circle cx="50" cy="18" r="5" fill="#28c840"/>
  <!-- address bar -->
  <rect x="180" y="9" width="600" height="18" rx="4" fill="#21262d"/>
  <text x="480" y="22" text-anchor="middle" font-size="11" fill="#4a5a7a" font-family="monospace">localhost:8000</text>

  <!-- SIDEBAR -->
  <rect x="0" y="36" width="300" height="444" fill="#0d1117" rx="0"/>
  <rect x="0" y="36" width="300" height="444" fill="#10161f"/>

  <!-- sidebar header -->
  <text x="18" y="63" font-size="16" fill="#e8edf7" font-family="sans-serif" font-weight="600">◈ dagscope</text>

  <!-- tabs -->
  <rect x="12" y="74" width="130" height="28" rx="5" fill="#0d4a3a"/>
  <text x="77" y="92" text-anchor="middle" font-size="11" fill="#22d3a0" font-family="sans-serif" font-weight="600">Blast Radius</text>
  <rect x="150" y="74" width="130" height="28" rx="5" fill="#1e2533"/>
  <text x="215" y="92" text-anchor="middle" font-size="11" fill="#4a5a7a" font-family="sans-serif">AI Analysis</text>

  <!-- selected node label -->
  <text x="18" y="120" font-size="10" fill="#4a5a7a" font-family="sans-serif">Selected</text>
  <rect x="12" y="125" width="272" height="26" rx="5" fill="#1a0a24" stroke="#bc8cff" stroke-width="1"/>
  <text x="148" y="142" text-anchor="middle" font-size="11" fill="#bc8cff" font-family="monospace">public.positions_daily</text>

  <!-- impact list -->
  <text x="18" y="168" font-size="10" fill="#4a5a7a" font-family="sans-serif">11 affected nodes</text>

  <!-- item rows -->
  <!-- hop 1 -->
  <rect x="12" y="174" width="272" height="24" rx="3" fill="#1a2a1a"/>
  <rect x="12" y="174" width="3" height="24" fill="#22d3a0"/>
  <text x="22" y="190" font-size="10" fill="#e8edf7" font-family="monospace">positions_usd.build_positions_usd</text>
  <text x="272" y="190" text-anchor="end" font-size="9" fill="#22d3a0" font-family="monospace">1 hop</text>

  <rect x="12" y="200" width="272" height="24" rx="3" fill="#1a2a1a"/>
  <rect x="12" y="200" width="3" height="24" fill="#22d3a0"/>
  <text x="22" y="216" font-size="10" fill="#e8edf7" font-family="monospace">settlement_breaks.compute_breaks</text>
  <text x="272" y="216" text-anchor="end" font-size="9" fill="#22d3a0" font-family="monospace">1 hop</text>

  <!-- hop 2 -->
  <rect x="12" y="226" width="272" height="24" rx="3" fill="#1e2533"/>
  <rect x="12" y="226" width="3" height="24" fill="#4a8a70"/>
  <text x="22" y="242" font-size="10" fill="#c0c8d8" font-family="monospace">public.positions_usd</text>
  <text x="272" y="242" text-anchor="end" font-size="9" fill="#4a8a70" font-family="monospace">2 hops</text>

  <rect x="12" y="252" width="272" height="24" rx="3" fill="#1e2533"/>
  <rect x="12" y="252" width="3" height="24" fill="#4a8a70"/>
  <text x="22" y="268" font-size="10" fill="#c0c8d8" font-family="monospace">public.settlement_breaks</text>
  <text x="272" y="268" text-anchor="end" font-size="9" fill="#4a8a70" font-family="monospace">2 hops</text>

  <!-- hop 3+ -->
  <rect x="12" y="278" width="272" height="24" rx="3" fill="#1e2533"/>
  <rect x="12" y="278" width="3" height="24" fill="#2a4a3a"/>
  <text x="22" y="294" font-size="10" fill="#8a9ab0" font-family="monospace">pnl_daily.build_pnl</text>
  <text x="272" y="294" text-anchor="end" font-size="9" fill="#2a4a3a" font-family="monospace">3 hops</text>

  <rect x="12" y="304" width="272" height="24" rx="3" fill="#1e2533"/>
  <rect x="12" y="304" width="3" height="24" fill="#2a4a3a"/>
  <text x="22" y="320" font-size="10" fill="#8a9ab0" font-family="monospace">public.pnl_daily</text>
  <text x="272" y="320" text-anchor="end" font-size="9" fill="#2a4a3a" font-family="monospace">4 hops</text>

  <rect x="12" y="330" width="272" height="24" rx="3" fill="#1e2533"/>
  <rect x="12" y="330" width="3" height="24" fill="#2a4a3a"/>
  <text x="22" y="346" font-size="10" fill="#8a9ab0" font-family="monospace">exposure_report.generate_report</text>
  <text x="272" y="346" text-anchor="end" font-size="9" fill="#2a4a3a" font-family="monospace">5 hops</text>

  <rect x="12" y="356" width="272" height="24" rx="3" fill="#1e2533"/>
  <rect x="12" y="356" width="3" height="24" fill="#2a4a3a"/>
  <text x="22" y="372" font-size="10" fill="#8a9ab0" font-family="monospace">public.risk_dashboard_ext</text>
  <text x="272" y="372" text-anchor="end" font-size="9" fill="#2a4a3a" font-family="monospace">6 hops</text>

  <!-- severity badge -->
  <rect x="12" y="394" width="272" height="32" rx="5" fill="#3d0a24" stroke="#ff4060" stroke-width="1"/>
  <text x="148" y="412" text-anchor="middle" font-size="11" fill="#ff6080" font-family="sans-serif" font-weight="600">severity: critical</text>
  <text x="148" y="423" text-anchor="middle" font-size="9" fill="#c05070" font-family="sans-serif">spans 6 hops · 11 nodes</text>

  <!-- sidebar border -->
  <line x1="300" y1="36" x2="300" y2="480" stroke="#21262d" stroke-width="1"/>

  <!-- GRAPH AREA -->
  <rect x="300" y="36" width="660" height="444" fill="#070d1a"/>

  <!-- graph nodes -->
  <!-- raw.trades (amber) -->
  <ellipse cx="380" cy="130" rx="70" ry="22" fill="#2d1f00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="380" y="127" text-anchor="middle" font-size="9" fill="#f5a623" font-family="monospace">raw</text>
  <text x="380" y="138" text-anchor="middle" font-size="9" fill="#e8edf7" font-family="monospace">.trades</text>

  <!-- raw.fx_rates (amber) -->
  <ellipse cx="360" cy="310" rx="70" ry="22" fill="#2d1f00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="360" y="307" text-anchor="middle" font-size="9" fill="#f5a623" font-family="monospace">raw</text>
  <text x="360" y="318" text-anchor="middle" font-size="9" fill="#e8edf7" font-family="monospace">.fx_rates</text>

  <!-- public.positions_daily (RED - selected) -->
  <ellipse cx="545" cy="190" rx="88" ry="26" fill="#3d0a24" stroke="#ff4060" stroke-width="3"/>
  <text x="545" y="187" text-anchor="middle" font-size="10" fill="#ff8080" font-family="monospace" font-weight="bold">public</text>
  <text x="545" y="200" text-anchor="middle" font-size="10" fill="#ffb0b0" font-family="monospace">.positions_daily</text>

  <!-- public.settlement_breaks (orange - blast) -->
  <ellipse cx="545" cy="310" rx="88" ry="22" fill="#2a1a00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="545" y="307" text-anchor="middle" font-size="9" fill="#f5a623" font-family="monospace">public</text>
  <text x="545" y="318" text-anchor="middle" font-size="9" fill="#e8edf7" font-family="monospace">.settlement_breaks</text>

  <!-- public.positions_usd (orange) -->
  <ellipse cx="700" cy="130" rx="80" ry="22" fill="#2a1a00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="700" y="127" text-anchor="middle" font-size="9" fill="#f5a623" font-family="monospace">public</text>
  <text x="700" y="138" text-anchor="middle" font-size="9" fill="#e8edf7" font-family="monospace">.positions_usd</text>

  <!-- public.pnl_daily (orange) -->
  <ellipse cx="830" cy="220" rx="68" ry="22" fill="#2a1a00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="830" y="217" text-anchor="middle" font-size="9" fill="#f5a623" font-family="monospace">public</text>
  <text x="830" y="228" text-anchor="middle" font-size="9" fill="#e8edf7" font-family="monospace">.pnl_daily</text>

  <!-- risk_dashboard_ext (orange, far right) -->
  <ellipse cx="890" cy="360" rx="58" ry="20" fill="#2a1a00" stroke="#f5a623" stroke-width="1.5"/>
  <text x="890" y="357" text-anchor="middle" font-size="8" fill="#f5a623" font-family="monospace">public</text>
  <text x="890" y="367" text-anchor="middle" font-size="7" fill="#e8edf7" font-family="monospace">.risk_dashboard_ext</text>

  <!-- edges -->
  <!-- raw.trades → positions_daily -->
  <line x1="448" y1="134" x2="456" y2="175" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#aw)"/>
  <!-- raw.fx_rates → positions_usd -->
  <line x1="428" y1="302" x2="620" y2="143" stroke="#4a5a7a" stroke-width="1" stroke-opacity="0.5" marker-end="url(#aw2)"/>
  <!-- positions_daily → positions_usd -->
  <line x1="630" y1="175" x2="622" y2="143" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#aw)"/>
  <!-- positions_daily → settlement_breaks (down, orange) -->
  <line x1="545" y1="216" x2="545" y2="288" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#aw)"/>
  <!-- positions_usd → pnl_daily -->
  <line x1="776" y1="141" x2="796" y2="206" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#aw)"/>
  <!-- pnl_daily → risk_dashboard_ext -->
  <line x1="852" y1="238" x2="876" y2="342" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.7" marker-end="url(#aw)"/>

  <!-- cycle indicator overlay -->
  <text x="490" y="262" font-size="11" fill="#ff4060" font-family="monospace" font-weight="bold">⟳</text>

  <defs>
    <marker id="aw"  markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6Z" fill="#f5a623"/></marker>
    <marker id="aw2" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6Z" fill="#4a5a7a"/></marker>
  </defs>

  <!-- legend top-right of graph -->
  <circle cx="688" cy="392" r="5" fill="#ff4060"/>
  <text x="697" y="396" font-size="9" fill="#9aa5b8" font-family="sans-serif">selected node</text>
  <circle cx="688" cy="408" r="5" fill="#f5a623"/>
  <text x="697" y="412" font-size="9" fill="#9aa5b8" font-family="sans-serif">blast radius</text>
  <circle cx="688" cy="424" r="5" fill="#22d3a0"/>
  <text x="697" y="428" font-size="9" fill="#9aa5b8" font-family="sans-serif">unaffected</text>
</svg>
